name: KLanding source integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: klanding-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON artifacts and K15 baseline
        run: node scripts/validate-source.mjs
      - name: Build review-only bundle from the canonical passport example
        run: node scripts/build-review-bundle.mjs --passport examples/project-passport.example.json --out /tmp/klanding-review-bundle
      - name: Run K15 static product and interaction audit
        run: node scripts/audit-k15.mjs

  browser-smoke:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/klanding-http.log 2>&1 &
      - name: Run K15 browser smoke tests
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k15-browser-audit
          path: |
            test-results/
            playwright-report/
            /tmp/klanding-review-bundle/
          if-no-files-found: ignore
