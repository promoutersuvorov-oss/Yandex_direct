name: KLanding source integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/universal-landing-runtime-v2, feat/canonical-runtime-browser-handoff, feat/primary-runtime-project-diversity]

permissions:
  contents: read

concurrency:
  group: klanding-ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate passport example against JSON Schema
        run: python scripts/validate-passport-schema.py
      - name: Validate KD 905 draft passport against JSON Schema
        run: python scripts/validate-passport-schema.py examples/kd-905.project-passport.draft.json
      - name: Validate CTA context contract schema and negative cases
        run: python scripts/validate-cta-context-schema.py
      - name: Validate LANDING BRIEF schema and example
        run: python scripts/validate-landing-brief-schema.py
      - name: Generate synthetic passport fixture for location evidence schema validation
        run: node scripts/create-browser-preview-fixture.mjs --out artifacts/browser-fixture/passport.json
      - name: Validate synthetic passport and location evidence against JSON Schema
        run: python scripts/validate-passport-schema.py artifacts/browser-fixture/passport.json
      - name: Validate JSON artifacts and K15 baseline
        run: node scripts/validate-source.mjs
      - name: Test first-touch and last-touch attribution
        run: node --test tests/attribution.test.mjs
      - name: Test canonical lead payload validation
        run: node --test tests/lead-payload.test.mjs
      - name: Test passport to runtime adapter and publication gates
        run: node --test tests/landing-runtime-adapter.test.mjs
      - name: Test Passport 1.0.0 normalization and provenance preservation
        run: node --test tests/passport-normalizer-v1.test.mjs
      - name: Test LANDING BRIEF reference integrity
        run: node --test tests/landing-brief.test.mjs
      - name: Test Landing Inputs normalization
        run: node --test tests/landing-inputs-normalizer-v1.test.mjs
      - name: Test normalized runtime builder publication gates
        run: node --test tests/landing-runtime-builder-v1.test.mjs
      - name: Test canonical runtime CLI output and primary runtime target
        run: node --test tests/canonical-runtime-builder.test.mjs
      - name: Test KEY Landing Module Registry
        run: node --test tests/landing-module-registry-v1.test.mjs
      - name: Test dedicated lifestyle runtime contract
        run: node --test tests/lifestyle-runtime-contract.test.mjs
      - name: Build review-only bundle from the canonical passport example
        run: node scripts/build-review-bundle.mjs --passport examples/project-passport.example.json --out artifacts/review-bundle
      - name: Render dynamic HTML review preview
        run: node scripts/render-review-preview.mjs --bundle artifacts/review-bundle --out artifacts/review-bundle/preview.html
      - name: Build the second real-project review bundle (KD 905)
        run: node scripts/build-review-bundle.mjs --passport examples/kd-905.project-passport.draft.json --out artifacts/kd905-review
      - name: Render the KD 905 internal review preview
        run: node scripts/render-review-preview.mjs --bundle artifacts/kd905-review --out artifacts/kd905-review/preview.html
      - name: Verify KD 905 project isolation and publication safeguards
        run: node scripts/test-kd905-review.mjs artifacts/kd905-review
      - name: Test renderer diversity across distinct project passports
        run: node scripts/test-renderer-diversity.mjs
      - name: Render independent editorial reference concept
        run: node scripts/render-reference-landing.mjs --bundle artifacts/review-bundle --out artifacts/review-bundle/reference.html
      - name: Test reference renderer structure and safety
        run: node scripts/test-reference-renderer.mjs artifacts/review-bundle/reference.html
      - name: Test review bundle evidence and privacy gates
        run: node scripts/test-review-bundle.mjs
      - name: Run K15 static product and interaction audit
        run: node scripts/audit-k15.mjs
      - name: Upload review-only bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: klanding-review-bundle
          path: artifacts/review-bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Upload KD 905 internal review preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kd905-internal-review-preview
          path: artifacts/kd905-review/
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    needs: source-integrity
    runs-on: ubuntu-24.04
    container:
      # Keep the image version aligned with @playwright/test below.
      # Browser binaries and OS dependencies are preinstalled; avoid slow apt setup.
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      KEY_BROWSER: ${{ matrix.browser }}
      # Firefox in the official container runs as root; GitHub's default HOME
      # points to a pwuser-owned directory and prevents Firefox from launching.
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create synthetic interactive passport fixture
        run: node scripts/create-browser-preview-fixture.mjs --out artifacts/browser-fixture/passport.json
      - name: Build review bundle for browser validation
        run: node scripts/build-review-bundle.mjs --passport artifacts/browser-fixture/passport.json --out artifacts/review-bundle
      - name: Render review preview for browser validation
        run: node scripts/render-review-preview.mjs --bundle artifacts/review-bundle --out artifacts/review-bundle/preview.html
      - name: Build KD 905 preview for cross-browser validation
        run: node scripts/build-review-bundle.mjs --passport examples/kd-905.project-passport.draft.json --out artifacts/kd905-review
      - name: Render KD 905 preview for cross-browser validation
        run: node scripts/render-review-preview.mjs --bundle artifacts/kd905-review --out artifacts/kd905-review/preview.html
      - name: Render editorial reference concept for browser validation
        run: node scripts/render-reference-landing.mjs --bundle artifacts/review-bundle --out artifacts/review-bundle/reference.html
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      # The pinned Playwright container already includes all three browser engines.
      - name: Create evidence-safe Galiley passport fixture for the primary runtime
        run: node scripts/create-canonical-runtime-fixture.mjs --out artifacts/canonical-runtime/galiley/passport.json
      - name: Build canonical Galiley profile for the primary browser runtime
        run: node scripts/build-landing-runtime.mjs --passport artifacts/canonical-runtime/galiley/passport.json --marketing tests/fixtures/canonical-runtime-marketing.json --out artifacts/canonical-runtime/galiley/project.config.js
      - name: Create evidence-safe KD 905 passport fixture for the primary runtime
        run: node scripts/create-kd905-runtime-fixture.mjs --out artifacts/canonical-runtime/kd-905/passport.json
      - name: Build canonical KD 905 profile for the primary browser runtime
        run: node scripts/build-landing-runtime.mjs --passport artifacts/canonical-runtime/kd-905/passport.json --marketing tests/fixtures/canonical-runtime-kd905-marketing.json --out artifacts/canonical-runtime/kd-905/project.config.js
      - name: Start local static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/klanding-http.log 2>&1 &
      - name: Run K15 and reference concept browser smoke tests
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k15-browser-audit-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
